name: Build TDLib for Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            make git zlib1g-dev libssl-dev gperf php-cli \
            cmake clang libc++-dev libc++abi-dev

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Clone TDLib
        run: git clone --depth 1 https://github.com/tdlib/td.git tdlib

      - name: Build libtdjni for arm64-v8a
        run: |
          cd tdlib
          mkdir build-arm64 && cd build-arm64
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-23 \
                -DANDROID_STL=c++_shared \
                -DTD_ENABLE_JNI=ON \
                ..
          cmake --build . --target tdjni -j$(nproc)

      - name: Build libtdjni for armeabi-v7a
        run: |
          cd tdlib
          mkdir build-arm32 && cd build-arm32
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=armeabi-v7a \
                -DANDROID_PLATFORM=android-23 \
                -DANDROID_STL=c++_shared \
                -DTD_ENABLE_JNI=ON \
                ..
          cmake --build . --target tdjni -j$(nproc)

      - name: Build libtdjni for x86_64
        run: |
          cd tdlib
          mkdir build-x64 && cd build-x64
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=x86_64 \
                -DANDROID_PLATFORM=android-23 \
                -DANDROID_STL=c++_shared \
                -DTD_ENABLE_JNI=ON \
                ..
          cmake --build . --target tdjni -j$(nproc)

      - name: Collect .so files
        run: |
          mkdir -p out/arm64-v8a out/armeabi-v7a out/x86_64
          find tdlib/build-arm64 -name "*.so" -exec cp {} out/arm64-v8a/ \;
          find tdlib/build-arm32 -name "*.so" -exec cp {} out/armeabi-v7a/ \;
          find tdlib/build-x64  -name "*.so" -exec cp {} out/x86_64/ \;
          echo "=== arm64 ==="  && ls -lh out/arm64-v8a/
          echo "=== arm32 ==="  && ls -lh out/armeabi-v7a/
          echo "=== x86_64 ===" && ls -lh out/x86_64/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-natives
          path: out/
          retention-days: 14

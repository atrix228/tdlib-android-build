name: Build TDLib for Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y make git zlib1g-dev libssl-dev gperf php-cli cmake clang-14 libc++-14-dev libc++abi-14-dev

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Clone TDLib
        run: |
          git clone --depth 1 https://github.com/tdlib/td.git tdlib

      - name: Build TDLib for arm64-v8a
        run: |
          cd tdlib
          mkdir build-arm64 && cd build-arm64
          cmake -DCMAKE_BUILD_TYPE=Release                 -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake                 -DANDROID_ABI=arm64-v8a                 -DANDROID_PLATFORM=android-23                 -DANDROID_STL=c++_shared                 -DTD_ENABLE_JNI=ON                 ..
          cmake --build . --target tdjni -j4

      - name: Build TDLib for armeabi-v7a
        run: |
          cd tdlib
          mkdir build-arm32 && cd build-arm32
          cmake -DCMAKE_BUILD_TYPE=Release                 -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake                 -DANDROID_ABI=armeabi-v7a                 -DANDROID_PLATFORM=android-23                 -DANDROID_STL=c++_shared                 ..
          cmake --build . --target tdjni -j4

      - name: Collect artifacts
        run: |
          mkdir -p out/arm64-v8a out/armeabi-v7a
          cp tdlib/build-arm64/libtdjni.so out/arm64-v8a/ 2>/dev/null || true
          find tdlib/build-arm64 -name "*.so" | xargs -I{} cp {} out/arm64-v8a/ 2>/dev/null || true
          cp tdlib/build-arm32/libtdjni.so out/armeabi-v7a/ 2>/dev/null || true
          find tdlib/build-arm32 -name "*.so" | xargs -I{} cp {} out/armeabi-v7a/ 2>/dev/null || true
          ls -lh out/arm64-v8a/ out/armeabi-v7a/
          # Copy TDLib Java bindings
          mkdir -p out/java
          cp -r tdlib/td/telegram/telegram_api.tl out/java/ 2>/dev/null || true
          find tdlib -name "*.java" -path "*/jni/*" | head -20 | xargs -I{} cp {} out/java/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-natives
          path: out/
          retention-days: 7
